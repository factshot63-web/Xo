<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>X-O Ultra & Secret Chat</title>
    <!-- إعدادات PWA وشريط الحالة للآيفون -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0e15">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(23, 27, 38, 0.75);
            --primary: #ff2a5f;
            --primary-glow: rgba(255, 42, 95, 0.4);
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.35);
            --text-main: #ffffff;
            --text-sub: #a0a5ba;
            --board-cell: #131722;
        }

        /* منع التكبير والتقريب على الآيفون واللمس */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at top, #1a1d29 0%, #0b0c10 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* حاوية التطبيق الزجاجية */
        .app-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* Animations */
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulseNeon { 0%, 100% { box-shadow: 0 0 15px var(--primary-glow); } 50% { box-shadow: 0 0 30px var(--primary-glow); } }

        /* header */
        .header {
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ff2a5f, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* قسم اللعبة */
        #game-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: popIn 0.5s ease-out;
        }

        .mode-title {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 15px;
            font-weight: 500;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 330px;
            aspect-ratio: 1;
            background: rgba(0, 0, 0, 0.25);
            padding: 14px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cell {
            background: var(--board-cell);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.02);
        }

        .cell:active { transform: scale(0.95); }
        .cell.x { color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); }
        .cell.o { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }

        .status-bar {
            margin-top: 25px;
            font-size: 18px;
            font-weight: 700;
            min-height: 28px;
            color: var(--text-main);
        }

        /* نافذة السر المنبثقة */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 11, 16, 0.88);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: popIn 0.3s ease-out;
        }

        .modal-card {
            width: 85%;
            background: rgba(28, 33, 48, 0.9);
            border: 1px solid rgba(255, 42, 95, 0.3);
            border-radius: 24px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-card h3 { font-size: 20px; margin-bottom: 10px; color: var(--text-main); }
        .modal-card p { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; }

        .modal-card input {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            user-select: text;
        }

        .modal-card button {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--primary), #d81b60);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        /* قسم الشات السري (ندى ومحمد) */
        #chat-section {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            animation: popIn 0.4s ease-out;
        }

        .chat-header {
            padding: 18px;
            background: rgba(18, 21, 31, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .chat-header h2 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff2a5f, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message-bubble {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
            user-select: text;
            animation: popIn 0.25s ease-out;
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .chat-input-container {
            padding: 15px 15px calc(15px + env(safe-area-inset-bottom));
            background: rgba(18, 21, 31, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-container input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 15px;
            outline: none;
            user-select: text;
        }

        .chat-input-container button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary), #00f2fe);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--primary-glow);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header" id="secret-trigger-header">X - O ULTRA</div>

    <!-- قسم اللعبة -->
    <div id="game-section">
        <div class="mode-title">العب الآن ضد الذكاء الاصطناعي 🤖</div>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        
        <div class="status-bar" id="status-bar">دورك باللعب (X)</div>
    </div>

    <!-- النافذة السرية -->
    <div class="modal-overlay" id="secret-modal">
        <div class="modal-card">
            <h3>منطقة خاصة 🔒</h3>
            <p>أدخل الكود السري للوصول لغرفة الدردشة الخاصة</p>
            <input type="password" id="secret-input" placeholder="••••••••">
            <button id="verify-btn">دخول المحادثة</button>
            <div id="error-msg" style="color: #ff2a5f; font-size: 12px; margin-top: 10px; display: none;">الرمز غير صحيح!</div>
        </div>
    </div>

    <!-- قسم الشات السري (ندى ومحمد) -->
    <div id="chat-section">
        <div class="chat-header">
            <h2>ندى ومحمد ❤️</h2>
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Messages appear here -->
        </div>
        <div class="chat-input-container">
            <input type="text" id="chat-input" placeholder="اكتب رسالة هنا...">
            <button id="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        });
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBEtbRajG95opDRkHbstnmt79a4v8lUX0",
      authDomain: "xojs-4e0dc.firebaseapp.com",
      projectId: "xojs-4e0dc",
      storageBucket: "xojs-4e0dc.firebasestorage.app",
      messagingSenderId: "504484947768",
      appId: "1:504484947768:web:09b3040669d558bc0ac3cd",
      measurementId: "G-2BE5RYWLYZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'nada_and_mohamed_chat');

    // ==========================================
    // منطق الضغط السريع للتفعيل السرّي (على اللوحة والأزرار)
    // ==========================================
    let clickCount = 0;
    let clickTimer = null;

    const registerSecretTouch = () => {
        clickCount++;
        clearTimeout(clickTimer);
        
        if (clickCount >= 3) {
            document.getElementById('secret-modal').style.display = 'flex';
            clickCount = 0;
        }

        clickTimer = setTimeout(() => {
            clickCount = 0;
        }, 1200);
    };

    // تفعيل الضغط على عنوان الهيدر ولوحة اللعب بدون تداخل
    document.getElementById('secret-trigger-header').addEventListener('click', registerSecretTouch);
    document.getElementById('board').addEventListener('click', (e) => {
        // إذا ضغط بسرعة في الأطراف أو المربعات
        registerSecretTouch();
    });

    // التحقق من الرقم السري
    document.getElementById('verify-btn').addEventListener('click', () => {
        const input = document.getElementById('secret-input').value;
        if (input === "Homos77#") {
            document.getElementById('secret-modal').style.display = 'none';
            document.getElementById('game-section').style.display = 'none';
            document.getElementById('chat-section').style.display = 'flex';
        } else {
            const err = document.getElementById('error-msg');
            err.style.display = 'block';
            setTimeout(() => err.style.display = 'none', 2000);
        }
    });

    // ==========================================
    // منطق اللعبة X-O ضد الكمبيوتر
    // ==========================================
    let board = ["", "", "", "", "", "", "", "", ""];
    let player = "X";
    let computer = "O";
    let active = true;

    const cells = document.querySelectorAll('.cell');
    const statusBar = document.getElementById('status-bar');

    const winPatterns = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    cells.forEach(cell => {
        cell.addEventListener('click', () => {
            const idx = cell.getAttribute('data-index');
            if (board[idx] === "" && active) {
                playTurn(idx, player);
                if (active) {
                    setTimeout(botMove, 400);
                }
            }
        });
    });

    function playTurn(idx, symbol) {
        board[idx] = symbol;
        cells[idx].innerText = symbol;
        cells[idx].classList.add(symbol.toLowerCase());
        checkGameStatus();
    }

    function botMove() {
        let emptyIndices = board.map((val, i) => val === "" ? i : null).filter(v => v !== null);
        if (emptyIndices.length > 0) {
            let choice = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            playTurn(choice, computer);
        }
    }

    function checkGameStatus() {
        let won = false;
        for (let pattern of winPatterns) {
            const [a, b, c] = pattern;
            if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                won = true;
                break;
            }
        }

        if (won) {
            statusBar.innerText = "انتهت اللعبة بالفوز! 🎉";
            active = false;
            setTimeout(resetGame, 2200);
            return;
        }

        if (!board.includes("")) {
            statusBar.innerText = "تعادل ممتاز! 🤝";
            active = false;
            setTimeout(resetGame, 2200);
        }
    }

    function resetGame() {
        board = ["", "", "", "", "", "", "", "", ""];
        active = true;
        statusBar.innerText = "دورك باللعب (X)";
        cells.forEach(c => {
            c.innerText = "";
            c.classList.remove('x', 'o');
        });
    }

    // ==========================================
    // شات "ندى ومحمد" السريع واللحظي
    // ==========================================
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-messages');

    sendBtn.addEventListener('click', sendMsg);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMsg();
    });

    function sendMsg() {
        const text = chatInput.value.trim();
        if (text) {
            push(chatRef, {
                msg: text,
                time: serverTimestamp()
            });
            chatInput.value = '';
        }
    }

    onChildAdded(chatRef, (snapshot) => {
        const data = snapshot.val();
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.innerText = data.msg;
        chatContainer.appendChild(bubble);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    });
</script>

</body>
</html>
