<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>X-O & More | Secret Chat</title>
    <meta name="theme-color" content="#0b0c10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg-main: #0a0b10;
            --card-glass: rgba(22, 26, 38, 0.75);
            --primary-grad: linear-gradient(135deg, #00c6ff, #0072ff);
            --secondary-grad: linear-gradient(135deg, #ff2a5f, #ff758c);
            --sent-bubble: linear-gradient(135deg, #005c4b, #00866c);
            --received-bubble: rgba(30, 36, 51, 0.85);
            --text-main: #ffffff;
            --text-sub: #949aaf;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none;
        }

        /* إصلاح حجم الشاشة للموبايل */
        body {
            background: radial-gradient(circle at top, #141824 0%, #08090d 100%);
            color: var(--text-main); display: flex; justify-content: center; align-items: center;
            height: 100dvh; /* الحل السحري للموبايل */
            overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 440px; height: 100%; 
            background: var(--card-glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        .header {
            padding: 15px 20px; text-align: center; font-size: 18px; font-weight: 900;
            background: linear-gradient(135deg, #00c6ff, #ff2a5f); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }

        /* ----- Game Section ----- */
        #game-section {
            flex: 1; display: flex; flex-direction: column; position: relative;
            padding-bottom: 70px; overflow-y: auto; overflow-x: hidden;
        }

        .nav-back-chat-btn {
            position: absolute; top: 10px; left: 15px; background: rgba(0, 198, 255, 0.15);
            border: 1px solid rgba(0, 198, 255, 0.3); color: #00c6ff; padding: 6px 14px;
            border-radius: 12px; font-size: 12px; font-weight: 800; cursor: pointer; display: none; z-index: 10;
        }

        .game-modes { display: flex; gap: 10px; margin: 15px auto; width: 90%; max-width: 320px; flex-shrink: 0; }
        .mode-btn {
            flex: 1; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: var(--text-sub); font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .mode-btn.active { background: var(--primary-grad); color: white; border-color: transparent; }

        /* سكور اللعب */
        .score-board {
            display: flex; justify-content: center; gap: 30px; margin-bottom: 10px; font-size: 14px; font-weight: bold;
            background: rgba(0,0,0,0.3); padding: 8px 20px; border-radius: 20px; width: fit-content; margin-left: auto; margin-right: auto;
        }
        .score-me { color: #00c6ff; }
        .score-enemy { color: #ff2a5f; }

        /* شات اللعب السريع */
        .quick-chat-bar {
            display: none; justify-content: center; gap: 8px; margin: 10px 0; overflow-x: auto; padding: 0 10px;
        }
        .quick-chat-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 15px;
            padding: 6px 12px; font-size: 16px; cursor: pointer; white-space: nowrap; color: #fff;
        }
        .quick-msg-toast {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: var(--received-bubble); color: white; padding: 12px 24px; border-radius: 20px;
            font-size: 20px; font-weight: bold; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s;
        }
        .quick-msg-toast.show { opacity: 1; transform: translate(-50%, -60%); }

        /* اللوبي (نظام الغرف) */
        .lobby-container { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 20px; text-align: center; }
        .lobby-box { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); width: 100%; max-width: 300px; margin-bottom: 15px; }
        .lobby-box h3 { font-size: 16px; margin-bottom: 15px; color: #fff; }
        .btn-action { background: var(--secondary-grad); color: white; border: none; padding: 12px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .room-code-display { font-size: 28px; font-weight: 900; letter-spacing: 4px; color: #00c6ff; margin: 15px 0; user-select: text; }
        .lobby-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; text-align: center; font-size: 16px; margin-bottom: 15px; outline: none; user-select: text; }

        /* منطقة اللعب */
        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .status-bar { margin: 10px 0 20px; font-size: 17px; font-weight: 700; color: var(--text-main); text-align: center; min-height: 25px; }

        /* X-O */
        .xo-board {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 90%; max-width: 300px;
            aspect-ratio: 1; background: rgba(0, 0, 0, 0.3); padding: 12px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
        }
        .cell {
            background: rgba(255, 255, 255, 0.03); border-radius: 18px; display: flex; justify-content: center; align-items: center;
            font-size: 40px; font-weight: 900; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .cell.x { color: #00c6ff; }
        .cell.o { color: #ff2a5f; }

        /* حجرة ورقة مقص */
        .rps-container { display: none; flex-direction: column; align-items: center; width: 100%; }
        .rps-choices { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .rps-btn { font-size: 40px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); width: 80px; height: 80px; border-radius: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .rps-btn.selected { background: var(--primary-grad); border-color: transparent; }
        .rps-battle { display: flex; justify-content: space-around; width: 100%; margin: 20px 0; font-size: 50px; }
        .rps-player-box { text-align: center; }
        .rps-player-name { font-size: 12px; color: var(--text-sub); margin-bottom: 5px; }

        /* شريط سفلي */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0; background: rgba(18, 22, 32, 0.95);
            border-top: 1px solid rgba(255,255,255,0.05); display: flex; padding: 10px 15px calc(10px + env(safe-area-inset-bottom));
        }
        .nav-tab { flex: 1; text-align: center; padding: 10px; color: var(--text-sub); font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 15px; transition: 0.3s; }
        .nav-tab.active { background: rgba(255,255,255,0.08); color: #00c6ff; }

        /* ----- Chat Section ----- */
        #chat-section { display: none; flex-direction: column; height: 100%; width: 100%; background: radial-gradient(circle at center, rgba(20, 25, 40, 0.5) 0%, rgba(10, 11, 16, 0.9) 100%); }
        .chat-header { padding: 12px 20px; background: rgba(18, 22, 32, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.06); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .chat-title-group { display: flex; align-items: center; gap: 12px; }
        .chat-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #ff2a5f, #00c6ff); display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .chat-info h2 { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 2px; }
        .chat-info p { font-size: 11px; color: #00c6ff; }
        .typing-indicator { font-size: 10px; color: #ff2a5f; font-weight: bold; display: none; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .chat-header-actions { display: flex; gap: 8px; }
        .game-toggle-btn { background: var(--primary-grad); color: #fff; border: none; padding: 7px 14px; border-radius: 12px; font-size: 12px; font-weight: 800; cursor: pointer; }
        
        /* ضبط الرسائل عشان متخرجش برا الشاشة */
        .chat-messages { flex: 1; padding: 15px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
        .message-row { display: flex; flex-direction: column; width: 100%; }
        .message-row.me { align-items: flex-start; }
        .message-row.me .message-bubble { background: var(--sent-bubble); color: #ffffff; border-radius: 20px 20px 4px 20px; }
        .message-row.other { align-items: flex-end; }
        .message-row.other .message-bubble { background: var(--received-bubble); color: #e0e6ed; border-radius: 20px 20px 20px 4px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .message-bubble { max-width: 82%; padding: 10px 14px 8px; font-size: 15px; word-break: break-word; user-select: text; position: relative; }
        .sender-name { font-size: 11px; font-weight: 800; margin-bottom: 4px; color: #00c6ff; }
        .message-footer { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px; font-size: 10px; color: rgba(255, 255, 255, 0.65); }
        .quoted-msg { background: rgba(0, 0, 0, 0.25); border-right: 4px solid #00c6ff; padding: 6px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 6px; color: rgba(255,255,255,0.8); }
        
        /* تثبيت مستطيل الإدخال أسفل الشاشة تماماً */
        .chat-input-area { 
            padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); 
            background: rgba(16, 20, 30, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.06); 
            display: flex; gap: 10px; align-items: center; flex-shrink: 0; width: 100%;
        }
        .chat-input-area input { flex: 1; padding: 13px 18px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.4); color: white; font-size: 15px; outline: none; }
        .chat-input-area button { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--primary-grad); color: white; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; }

        .reply-indicator { display: none; background: rgba(18, 22, 32, 0.95); padding: 8px 15px; border-top: 1px solid rgba(255,255,255,0.06); align-items: center; justify-content: space-between; font-size: 13px; border-left: 4px solid #ff2a5f; flex-shrink: 0; }

        /* Modal Overlay */
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(6, 7, 10, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); justify-content: center; align-items: center; z-index: 100; }
        .modal-card { width: 85%; background: rgba(25, 30, 45, 0.95); border: 1px solid rgba(0, 198, 255, 0.3); border-radius: 28px; padding: 28px 22px; text-align: center; }
        .modal-card h3 { font-size: 22px; margin-bottom: 8px; color: var(--text-main); }
        .modal-card input { width: 100%; padding: 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: #fff; font-size: 18px; text-align: center; outline: none; margin-bottom: 18px; }
        .modal-card button { width: 100%; padding: 15px; border-radius: 16px; border: none; background: var(--primary-grad); color: white; font-size: 16px; font-weight: 800; cursor: pointer; }
        .identity-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .identity-btn { flex: 1; padding: 12px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: var(--text-sub); font-weight: 700; cursor: pointer; }
        .identity-btn.active { background: var(--primary-grad); color: #fff; border-color: transparent; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span id="secret-trigger-header" style="cursor: pointer;">X-O & MORE 🎮</span>
    </div>

    <!-- قسم الألعاب -->
    <div id="game-section">
        <button class="nav-back-chat-btn" id="nav-back-chat">العودة للشات 💬</button>
        
        <div class="game-modes">
            <button class="mode-btn active" id="btn-mode-ai">ضد الكمبيوتر 🤖</button>
            <button class="mode-btn" id="btn-mode-online">لعب أونلاين 🌐</button>
        </div>
        
        <!-- اللوبي للأونلاين -->
        <div class="lobby-container" id="lobby-container">
            <div class="lobby-box">
                <h3>إنشاء غرفة جديدة</h3>
                <button class="btn-action" id="btn-create-room">توليد كود 🎲</button>
                <div class="room-code-display" id="room-code-display" style="display:none;"></div>
                <div id="lobby-waiting-text" style="color:var(--text-sub); font-size:12px; display:none;">في انتظار انضمام الطرف الآخر...</div>
            </div>
            <div class="lobby-box">
                <h3>الانضمام لغرفة</h3>
                <input type="number" id="input-room-code" class="lobby-input" placeholder="أدخل كود الغرفة (4 أرقام)">
                <button class="btn-action" id="btn-join-room" style="background:var(--primary-grad)">انضمام للعب 🚀</button>
            </div>
        </div>

        <!-- ساحة اللعب النشطة -->
        <div class="game-area" id="game-area">
            
            <div class="score-board">
                <div class="score-me">أنت: <span id="score-me-val">0</span></div>
                <div class="score-enemy">الخصم: <span id="score-enemy-val">0</span></div>
            </div>

            <!-- شريط الرسايل السريعة للأونلاين -->
            <div class="quick-chat-bar" id="quick-chat-bar">
                <button class="quick-chat-btn" data-msg="😂">😂</button>
                <button class="quick-chat-btn" data-msg="😡">😡</button>
                <button class="quick-chat-btn" data-msg="👏 عاش">👏 عاش</button>
                <button class="quick-chat-btn" data-msg="يلا بسرعة!">يلا بسرعة! ⏱️</button>
                <button class="quick-chat-btn" data-msg="حظ!">حظ! 🍀</button>
            </div>
            <div id="quick-msg-toast" class="quick-msg-toast"></div>

            <div class="status-bar" id="status-bar">دورك باللعب</div>

            <!-- X-O Board -->
            <div class="xo-board" id="xo-container">
                <div class="cell" data-index="0"></div><div class="cell" data-index="1"></div><div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div><div class="cell" data-index="4"></div><div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div><div class="cell" data-index="7"></div><div class="cell" data-index="8"></div>
            </div>

            <!-- حجرة ورقة مقص -->
            <div class="rps-container" id="rps-container">
                <div class="rps-battle">
                    <div class="rps-player-box">
                        <div class="rps-player-name">أنت</div>
                        <div id="rps-my-move">❔</div>
                    </div>
                    <div style="font-size: 20px; align-self: center; color:var(--text-sub)">VS</div>
                    <div class="rps-player-box">
                        <div class="rps-player-name">الخصم</div>
                        <div id="rps-enemy-move">❔</div>
                    </div>
                </div>
                <div class="rps-choices">
                    <div class="rps-btn" data-choice="✊">✊</div>
                    <div class="rps-btn" data-choice="✋">✋</div>
                    <div class="rps-btn" data-choice="✌️">✌️</div>
                </div>
            </div>
        </div>

        <!-- شريط التبديل السفلي -->
        <div class="bottom-nav">
            <div class="nav-tab active" data-game="xo">لعبة X-O</div>
            <div class="nav-tab" data-game="rps">حجرة ورقة مقص</div>
        </div>
    </div>

    <!-- النافذة السرية -->
    <div class="modal-overlay" id="secret-modal">
        <div class="modal-card">
            <h3>منطقة ندى ومحمد 🔒</h3>
            <p style="font-size:13px; color:#949aaf; margin-bottom:20px;">اختر حسابك وأدخل الكود السري</p>
            <div class="identity-selector">
                <button class="identity-btn" id="select-nada">ندى</button>
                <button class="identity-btn" id="select-mohamed">محمد</button>
            </div>
            <input type="password" id="secret-input" placeholder="••••••••">
            <button id="verify-btn">دخول المحادثة</button>
            <div id="error-msg" style="color: #ff2a5f; font-size: 13px; margin-top: 12px; display: none;">الرمز غير صحيح!</div>
        </div>
    </div>

    <!-- قسم الشات -->
    <div id="chat-section">
        <div class="chat-header">
            <div class="chat-title-group">
                <div class="chat-avatar">❤️</div>
                <div class="chat-info">
                    <h2>ندى ومحمد</h2>
                    <p id="current-user-display">متصل الآن</p>
                    <div class="typing-indicator" id="typing-indicator">الطرف الآخر يكتب الآن...</div>
                </div>
            </div>
            <div class="chat-header-actions">
                <button class="game-toggle-btn" id="btn-go-game">الألعاب 🎮</button>
            </div>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="reply-indicator" id="reply-indicator">
            <div style="color:white"><span id="reply-to-name" style="color:#ff2a5f; font-weight:bold; font-size:11px; display:block;"></span><div id="reply-to-text"></div></div>
            <button class="cancel-reply" id="cancel-reply" style="background:none; border:none; color:white; font-size:20px;">×</button>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="اكتب رسالة... (انقر مرتين للرد)">
            <button id="send-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, serverTimestamp, set, onValue, update, get, off, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBEtbRajG95opDRkHbstnmt79a4v8lUX0",
      authDomain: "xojs-4e0dc.firebaseapp.com",
      projectId: "xojs-4e0dc",
      storageBucket: "xojs-4e0dc.firebasestorage.app",
      messagingSenderId: "504484947768",
      appId: "1:504484947768:web:09b3040669d558bc0ac3cd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    // ==========================================
    // إعدادات المستخدم والشات السري
    // ==========================================
    let deviceId = localStorage.getItem('app_device_id') || ('dev_' + Math.random().toString(36).substring(2, 9));
    localStorage.setItem('app_device_id', deviceId);
    let selectedUser = localStorage.getItem('chat_username') || 'ندى';
    let hasUnlockedChat = false; 

    const btnNada = document.getElementById('select-nada');
    const btnMohamed = document.getElementById('select-mohamed');
    
    function updateIdentityButtons() {
        btnNada.classList.toggle('active', selectedUser === 'ندى');
        btnMohamed.classList.toggle('active', selectedUser === 'محمد');
    }
    updateIdentityButtons();
    btnNada.onclick = () => { selectedUser = 'ندى'; localStorage.setItem('chat_username', 'ندى'); updateIdentityButtons(); };
    btnMohamed.onclick = () => { selectedUser = 'محمد'; localStorage.setItem('chat_username', 'محمد'); updateIdentityButtons(); };

    let clickCount = 0, clickTimer = null;
    document.getElementById('secret-trigger-header').onclick = () => {
        if (hasUnlockedChat) { switchTabUI('chat'); return; }
        clickCount++; clearTimeout(clickTimer);
        if (clickCount >= 3) { document.getElementById('secret-modal').style.display = 'flex'; clickCount = 0; }
        clickTimer = setTimeout(() => clickCount = 0, 1200);
    };

    document.getElementById('verify-btn').onclick = () => {
        if (document.getElementById('secret-input').value === "Homos77#") {
            hasUnlockedChat = true; localStorage.setItem('chat_username', selectedUser);
            document.getElementById('current-user-display').innerText = `أنت الآن: ${selectedUser}`;
            document.getElementById('secret-modal').style.display = 'none';
            switchTabUI('chat');
        } else {
            document.getElementById('error-msg').style.display = 'block';
            setTimeout(() => document.getElementById('error-msg').style.display = 'none', 2000);
        }
    };

    function switchTabUI(tab) {
        document.getElementById('game-section').style.display = tab === 'game' ? 'flex' : 'none';
        document.getElementById('chat-section').style.display = tab === 'chat' ? 'flex' : 'none';
        document.getElementById('nav-back-chat').style.display = (tab === 'game' && hasUnlockedChat) ? 'block' : 'none';
    }
    document.getElementById('btn-go-game').onclick = () => switchTabUI('game');
    document.getElementById('nav-back-chat').onclick = () => switchTabUI('chat');

    // ==========================================
    // محرك الألعاب (مع حل مشكلة التبديل)
    // ==========================================
    let activeGame = 'xo';
    let playMode = 'ai';
    
    // Online Variables
    let currentRoomCode = null;
    let roomRef = null;
    let roomListener = null;
    let myRole = null; 
    let onlineXO_Symbol = null;
    let myScore = 0;
    let enemyScore = 0;

    // UI Elements
    const btnModeAi = document.getElementById('btn-mode-ai');
    const btnModeOnline = document.getElementById('btn-mode-online');
    const lobbyContainer = document.getElementById('lobby-container');
    const gameArea = document.getElementById('game-area');
    const xoContainer = document.getElementById('xo-container');
    const rpsContainer = document.getElementById('rps-container');
    const statusBar = document.getElementById('status-bar');
    const tabs = document.querySelectorAll('.nav-tab');
    const scoreMeVal = document.getElementById('score-me-val');
    const scoreEnemyVal = document.getElementById('score-enemy-val');
    const quickChatBar = document.getElementById('quick-chat-bar');

    function updateScoreUI() {
        scoreMeVal.innerText = myScore;
        scoreEnemyVal.innerText = enemyScore;
    }

    function hapticFeedback(type = 'light') {
        if(navigator.vibrate) {
            if(type === 'light') navigator.vibrate(50);
            if(type === 'heavy') navigator.vibrate([100, 50, 100]);
        }
    }

    // تنظيف الغرفة بالكامل عند تبديل المود لمنع اللاج
    function leaveRoom() {
        if(roomRef && roomListener) {
            off(roomRef, 'value', roomListener);
            // Optionally clear quick msg listener if separate
        }
        currentRoomCode = null; myRole = null; roomRef = null; roomListener = null;
        myScore = 0; enemyScore = 0; updateScoreUI();
        quickChatBar.style.display = 'none';
    }

    btnModeAi.onclick = () => { playMode = 'ai'; updateModeUI(); leaveRoom(); resetLocalGames(); };
    btnModeOnline.onclick = () => { playMode = 'online'; updateModeUI(); resetLocalGames(); };

    function updateModeUI() {
        btnModeAi.classList.toggle('active', playMode === 'ai');
        btnModeOnline.classList.toggle('active', playMode === 'online');
        if (playMode === 'ai') {
            lobbyContainer.style.display = 'none'; gameArea.style.display = 'flex';
        } else {
            if (currentRoomCode) { lobbyContainer.style.display = 'none'; gameArea.style.display = 'flex'; quickChatBar.style.display = 'flex'; }
            else { lobbyContainer.style.display = 'flex'; gameArea.style.display = 'none'; }
        }
    }

    // تبديل اللعبة
    tabs.forEach(tab => {
        tab.onclick = () => {
            const game = tab.getAttribute('data-game');
            tabs.forEach(t => t.classList.remove('active')); tab.classList.add('active');
            
            if (playMode === 'online' && currentRoomCode) {
                update(roomRef, { activeGame: game });
            } else {
                activeGame = game; updateGameContainers();
            }
        };
    });

    function updateGameContainers() {
        xoContainer.style.display = activeGame === 'xo' ? 'grid' : 'none';
        rpsContainer.style.display = activeGame === 'rps' ? 'flex' : 'none';
        tabs.forEach(t => t.classList.toggle('active', t.getAttribute('data-game') === activeGame));
        resetLocalGames();
    }

    // ---------------- الغرف الأونلاين ----------------
    document.getElementById('btn-create-room').onclick = () => {
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('room-code-display').innerText = code;
        document.getElementById('room-code-display').style.display = 'block';
        document.getElementById('lobby-waiting-text').style.display = 'block';
        joinOrCreateRoom(code, true);
    };

    document.getElementById('btn-join-room').onclick = () => {
        const code = document.getElementById('input-room-code').value;
        if(code.length === 4) joinOrCreateRoom(code, false);
    };

    function joinOrCreateRoom(code, isCreator) {
        leaveRoom();
        currentRoomCode = code;
        roomRef = ref(db, `rooms/${code}`);

        if (isCreator) {
            set(roomRef, {
                status: 'waiting', p1: deviceId, p2: null, activeGame: activeGame,
                xoState: { board: ["","","","","","","","",""], turn: 'X' },
                rpsState: { p1Choice: "", p2Choice: "" }, quickMsg: { msg: "", time: 0, from: "" }
            });
            myRole = 'p1'; onlineXO_Symbol = 'X';
        } else {
            get(roomRef).then((snap) => {
                const data = snap.val();
                if (data && data.status === 'waiting') {
                    update(roomRef, { p2: deviceId, status: 'playing' });
                    myRole = 'p2'; onlineXO_Symbol = 'O';
                }
            });
        }

        roomListener = onValue(roomRef, (snap) => {
            const data = snap.val();
            if (!data) return;

            if (data.activeGame !== activeGame) { activeGame = data.activeGame; updateGameContainers(); }

            if (data.status === 'waiting') {
                lobbyContainer.style.display = 'flex'; gameArea.style.display = 'none'; quickChatBar.style.display = 'none';
            } else if (data.status === 'playing') {
                lobbyContainer.style.display = 'none'; gameArea.style.display = 'flex'; quickChatBar.style.display = 'flex';
                
                if (activeGame === 'xo') syncXO(data.xoState);
                if (activeGame === 'rps') syncRPS(data.rpsState);

                // Quick Chat Toast
                if(data.quickMsg && data.quickMsg.time > Date.now() - 3000 && data.quickMsg.from !== deviceId) {
                    showQuickToast(data.quickMsg.msg); hapticFeedback();
                }
            }
        });
    }

    // ---------------- Quick Chat الأونلاين ----------------
    document.querySelectorAll('.quick-chat-btn').forEach(btn => {
        btn.onclick = () => {
            const msg = btn.getAttribute('data-msg');
            if(roomRef && currentRoomCode) {
                update(roomRef, { quickMsg: { msg: msg, time: Date.now(), from: deviceId } });
                showQuickToast(msg, true);
            }
        };
    });

    let toastTimer;
    function showQuickToast(msg, isMe = false) {
        const toast = document.getElementById('quick-msg-toast');
        toast.innerText = (isMe ? "أنت: " : "الخصم: ") + msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ---------------- منطق X-O ----------------
    let localBoard = ["","","","","","","","",""];
    let xoActive = true;
    const xoCells = document.querySelectorAll('.cell');
    const winPatterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    function checkWin(b) {
        for (let p of winPatterns) if (b[p[0]] && b[p[0]] === b[p[1]] && b[p[0]] === b[p[2]]) return b[p[0]];
        return b.includes("") ? null : "draw";
    }

    function resetLocalGames() {
        if(activeGame === 'xo') {
            localBoard = ["","","","","","","","",""]; xoActive = true;
            xoCells.forEach(c => { c.innerText = ""; c.className = 'cell'; });
            statusBar.innerText = "العب يا بطل (X)";
        } else {
            document.getElementById('rps-my-move').innerText = "❔"; document.getElementById('rps-enemy-move').innerText = "❔";
            document.querySelectorAll('.rps-btn').forEach(b => b.classList.remove('selected'));
            statusBar.innerText = "اختر حركتك!"; rpsActive = true;
        }
    }

    function botXOMove() {
        let empty = localBoard.map((v,i) => v===""?i:null).filter(v=>v!==null);
        if(empty.length > 0 && xoActive) {
            let idx = empty[Math.floor(Math.random() * empty.length)];
            localBoard[idx] = "O"; renderXOCell(idx, "O");
            let res = checkWin(localBoard);
            if(res) { 
                xoActive = false;
                if(res==="draw") statusBar.innerText = "تعادل! 🤝";
                else { statusBar.innerText = "الكمبيوتر فاز!"; enemyScore++; updateScoreUI(); hapticFeedback('heavy'); }
                setTimeout(resetLocalGames, 1500); 
            }
            else statusBar.innerText = "العب يا بطل (X)";
        }
    }

    // Fix click listeners (no multiple binding)
    xoCells.forEach(cell => {
        cell.onclick = () => {
            const idx = cell.getAttribute('data-index');
            if (playMode === 'ai' && xoActive && localBoard[idx] === "") {
                localBoard[idx] = "X"; renderXOCell(idx, "X"); hapticFeedback('light');
                let res = checkWin(localBoard);
                if(res) { 
                    xoActive = false; 
                    if(res==="draw") statusBar.innerText = "تعادل! 🤝"; 
                    else { statusBar.innerText = "عاش فزت! 🎉"; myScore++; updateScoreUI(); hapticFeedback('heavy'); }
                    setTimeout(resetLocalGames, 1500); 
                }
                else { statusBar.innerText = "دور الكمبيوتر..."; setTimeout(botXOMove, 500); }
            } 
            else if (playMode === 'online' && currentRoomCode) {
                get(roomRef).then((snap) => {
                    const state = snap.val().xoState;
                    if (state.turn === onlineXO_Symbol && state.board[idx] === "") {
                        state.board[idx] = onlineXO_Symbol;
                        state.turn = onlineXO_Symbol === "X" ? "O" : "X";
                        update(roomRef, { xoState: state }); hapticFeedback('light');
                    }
                });
            }
        };
    });

    function syncXO(state) {
        state.board.forEach((val, i) => renderXOCell(i, val));
        let res = checkWin(state.board);
        if(res) {
            if(res === "draw") { statusBar.innerText = "النتيجة تعادل! 🤝"; }
            else {
                if(res === onlineXO_Symbol) { statusBar.innerText = "عاش فزت! 🎉"; myScore++; hapticFeedback('heavy'); }
                else { statusBar.innerText = "الخصم فاز!"; enemyScore++; hapticFeedback('heavy'); }
                updateScoreUI();
            }
            if(myRole === 'p1') { setTimeout(() => update(roomRef, { xoState: { board: ["","","","","","","","",""], turn: 'X' } }), 2000); }
        } else {
            if(state.turn === onlineXO_Symbol) { statusBar.innerText = `دورك! العب (${onlineXO_Symbol})`; hapticFeedback('light'); }
            else { statusBar.innerText = `انتظر لعب الخصم...`; }
        }
    }

    function renderXOCell(idx, sym) { xoCells[idx].innerText = sym; xoCells[idx].className = 'cell ' + (sym ? sym.toLowerCase() : ''); }

    // ---------------- منطق حجرة ورقة مقص ----------------
    let rpsActive = true; const rpsBtns = document.querySelectorAll('.rps-btn'); const rpsOptions = ["✊", "✋", "✌️"];
    
    function resolveRPS(p1, p2) {
        if(p1 === p2) return "draw";
        if((p1==="✊"&&p2==="✌️") || (p1==="✋"&&p2==="✊") || (p1==="✌️"&&p2==="✋")) return "p1";
        return "p2";
    }

    rpsBtns.forEach(btn => {
        btn.onclick = () => {
            if(!rpsActive) return;
            const myChoice = btn.getAttribute('data-choice');
            hapticFeedback('light');
            
            if (playMode === 'ai') {
                rpsBtns.forEach(b => b.classList.remove('selected')); btn.classList.add('selected');
                document.getElementById('rps-my-move').innerText = myChoice;
                let botChoice = rpsOptions[Math.floor(Math.random()*3)];
                document.getElementById('rps-enemy-move').innerText = botChoice;
                
                let res = resolveRPS(myChoice, botChoice);
                if(res === "draw") statusBar.innerText = "تعادل!";
                else if(res === "p1") { statusBar.innerText = "فزت! 🎉"; myScore++; hapticFeedback('heavy'); }
                else { statusBar.innerText = "خسرت!"; enemyScore++; hapticFeedback('heavy'); }
                updateScoreUI(); rpsActive = false; setTimeout(resetLocalGames, 2000);
            } 
            else if (playMode === 'online' && currentRoomCode) {
                rpsBtns.forEach(b => b.classList.remove('selected')); btn.classList.add('selected');
                document.getElementById('rps-my-move').innerText = myChoice;
                statusBar.innerText = "في انتظار اختيار الخصم...";
                update(roomRef, { [`rpsState/${myRole}Choice`]: myChoice });
            }
        };
    });

    function syncRPS(state) {
        if(!state.p1Choice && !state.p2Choice) {
            document.getElementById('rps-my-move').innerText = "❔"; document.getElementById('rps-enemy-move').innerText = "❔";
            rpsBtns.forEach(b => b.classList.remove('selected')); statusBar.innerText = "اختر حركتك!";
        }
        else if (state.p1Choice && state.p2Choice) {
            const myC = myRole === 'p1' ? state.p1Choice : state.p2Choice;
            const enC = myRole === 'p1' ? state.p2Choice : state.p1Choice;
            document.getElementById('rps-my-move').innerText = myC; document.getElementById('rps-enemy-move').innerText = enC;
            
            let res = resolveRPS(state.p1Choice, state.p2Choice);
            if (res === "draw") statusBar.innerText = "تعادل!";
            else if (res === myRole) { statusBar.innerText = "أنت الفائز! 🎉"; myScore++; hapticFeedback('heavy'); }
            else { statusBar.innerText = "الخصم فاز!"; enemyScore++; hapticFeedback('heavy'); }
            
            updateScoreUI();
            if (myRole === 'p1') { setTimeout(() => update(roomRef, { rpsState: { p1Choice: "", p2Choice: "" } }), 2500); }
        }
        else if ((myRole==='p1' && state.p1Choice) || (myRole==='p2' && state.p2Choice)) { statusBar.innerText = "في انتظار الخصم..."; }
        else { statusBar.innerText = "الخصم اختار، دورك!"; hapticFeedback('light'); }
    }

    // ==========================================
    // محرك الشات و "جاري الكتابة..."
    // ==========================================
    const chatRef = ref(db, 'nada_mohamed_v2'); 
    const typingRef = ref(db, 'nada_mohamed_v2_typing');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-messages');

    let replyToData = null; 
    document.getElementById('cancel-reply').onclick = () => { replyToData = null; document.getElementById('reply-indicator').style.display = 'none'; };

    // مؤشر جاري الكتابة
    let typingTimer;
    chatInput.addEventListener('input', () => {
        set(ref(db, 'nada_mohamed_v2_typing/' + deviceId), { name: selectedUser, time: Date.now() });
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => remove(ref(db, 'nada_mohamed_v2_typing/' + deviceId)), 1500);
    });
    
    // عند قفل الموقع يمسح حالة الكتابة
    onDisconnect(ref(db, 'nada_mohamed_v2_typing/' + deviceId)).remove();

    onValue(typingRef, (snap) => {
        const data = snap.val();
        let isOtherTyping = false;
        if(data) {
            Object.keys(data).forEach(key => { if(key !== deviceId && data[key].time > Date.now() - 3000) isOtherTyping = true; });
        }
        document.getElementById('typing-indicator').style.display = isOtherTyping ? 'block' : 'none';
        document.getElementById('current-user-display').style.display = isOtherTyping ? 'none' : 'block';
    });

    function sendMsg() {
        const text = chatInput.value.trim();
        if (text) {
            let msgPayload = {
                senderId: deviceId, senderName: selectedUser, msg: text,
                time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                timestamp: serverTimestamp()
            };
            if (replyToData) msgPayload.replyTo = replyToData;
            push(chatRef, msgPayload);
            chatInput.value = ''; document.getElementById('cancel-reply').click();
            remove(ref(db, 'nada_mohamed_v2_typing/' + deviceId)); // مسح حالة الكتابة بعد الإرسال
        }
    }
    sendBtn.onclick = sendMsg;
    chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendMsg(); };

    onChildAdded(chatRef, (snapshot) => {
        const data = snapshot.val();
        const isMe = (data.senderId === deviceId) || (data.senderName === selectedUser);
        const row = document.createElement('div'); row.className = `message-row ${isMe ? 'me' : 'other'}`;
        
        let replyHtml = data.replyTo ? `<div class="quoted-msg"><div class="quoted-sender">${data.replyTo.sender}</div><div>${data.replyTo.text}</div></div>` : '';
        let nameHtml = !isMe ? `<div class="sender-name">${data.senderName || 'الطرف الآخر'}</div>` : '';
        
        const bubble = document.createElement('div'); bubble.className = 'message-bubble';
        bubble.innerHTML = `${nameHtml}${replyHtml}<div>${data.msg}</div><div class="message-footer"><span>${data.time || ''}</span>${isMe ? '<span class="ticks" style="color:#00f2fe;font-size:12px;margin-right:3px;">✓✓</span>' : ''}</div>`;
        
        // اهتزاز عند استلام رسالة جديدة
        if(!isMe) hapticFeedback('light');

        let tapTimeout, lastTap = 0;
        const triggerReply = (e) => {
            if(e) e.preventDefault();
            let shortText = data.msg.length > 40 ? data.msg.substring(0, 40) + '...' : data.msg;
            replyToData = { sender: data.senderName || (isMe ? selectedUser : 'الطرف الآخر'), text: shortText };
            document.getElementById('reply-to-name').innerText = `الرد على: ${replyToData.sender}`;
            document.getElementById('reply-to-text').innerText = shortText;
            document.getElementById('reply-indicator').style.display = 'flex';
            chatInput.focus();
        };
        bubble.ontouchend = (e) => {
            let cur = new Date().getTime(), len = cur - lastTap;
            clearTimeout(tapTimeout);
            if (len < 500 && len > 0) triggerReply(e);
            else tapTimeout = setTimeout(() => clearTimeout(tapTimeout), 500);
            lastTap = cur;
        };
        bubble.ondblclick = () => triggerReply();

        row.appendChild(bubble); chatContainer.appendChild(row); chatContainer.scrollTop = chatContainer.scrollHeight;
    });

</script>
</body>
</html>
