<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>X-O Ultra & Secret Chat</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0c10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    
    <style>
        /* [نفس الألوان والتصميمات الفاخرة السابقة] */
        :root {
            --bg-main: #0a0b10;
            --card-glass: rgba(22, 26, 38, 0.75);
            --primary-grad: linear-gradient(135deg, #00c6ff, #0072ff);
            --secondary-grad: linear-gradient(135deg, #ff2a5f, #ff758c);
            --sent-bubble: linear-gradient(135deg, #005c4b, #00866c);
            --received-bubble: rgba(30, 36, 51, 0.85);
            --text-main: #ffffff;
            --text-sub: #949aaf;
            --accent-glow: rgba(0, 198, 255, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at top, #141824 0%, #08090d 100%);
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: -webkit-fill-available;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .app-container {
            width: 100%; max-width: 440px; height: 100vh; max-height: 920px;
            background: var(--card-glass); backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px; display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        @keyframes springUp { 0% { transform: translateY(20px) scale(0.95); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
        @keyframes highlight { 0% { background: rgba(0, 198, 255, 0.3); } 100% { background: transparent; } }

        .header {
            padding: 18px; text-align: center; font-size: 20px; font-weight: 900;
            letter-spacing: 1.5px; background: linear-gradient(135deg, #00c6ff, #ff2a5f);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Game Section */
        #game-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; animation: springUp 0.5s ease; }
        
        .game-modes {
            display: flex; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 320px;
        }
        .mode-btn {
            flex: 1; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: var(--text-sub); font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }
        .mode-btn.active { background: var(--primary-grad); color: white; border-color: transparent; box-shadow: 0 4px 15px var(--accent-glow); }

        .board {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            width: 100%; max-width: 320px; aspect-ratio: 1; background: rgba(0, 0, 0, 0.3);
            padding: 14px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .cell {
            background: rgba(255, 255, 255, 0.03); border-radius: 18px; display: flex;
            justify-content: center; align-items: center; font-size: 42px; font-weight: 900;
            cursor: pointer; transition: all 0.2s ease; border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .cell:active { transform: scale(0.92); }
        .cell.x { color: #00c6ff; text-shadow: 0 0 15px rgba(0, 198, 255, 0.5); }
        .cell.o { color: #ff2a5f; text-shadow: 0 0 15px rgba(255, 42, 95, 0.5); }
        .status-bar { margin-top: 25px; font-size: 17px; font-weight: 700; min-height: 25px; text-align: center; color: var(--text-main); }
        .online-controls { margin-top: 15px; display: none; }
        .btn-join { background: var(--secondary-grad); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* Modal */
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(6, 7, 10, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); justify-content: center; align-items: center; z-index: 100; }
        .modal-card { width: 85%; background: rgba(25, 30, 45, 0.95); border: 1px solid rgba(0, 198, 255, 0.3); border-radius: 28px; padding: 28px 22px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
        .modal-card h3 { font-size: 22px; margin-bottom: 8px; color: white; }
        .modal-card input { width: 100%; padding: 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: white; font-size: 18px; text-align: center; outline: none; margin-bottom: 18px; user-select: text; }
        .modal-card button { width: 100%; padding: 15px; border-radius: 16px; border: none; background: var(--primary-grad); color: white; font-size: 16px; font-weight: 800; cursor: pointer; }
        .identity-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .identity-btn { flex: 1; padding: 12px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: var(--text-sub); font-weight: 700; cursor: pointer; }
        .identity-btn.active { background: var(--primary-grad); color: white; border-color: transparent; }

        /* Chat Section */
        #chat-section { display: none; flex-direction: column; height: 100%; width: 100%; background: radial-gradient(circle at center, rgba(20, 25, 40, 0.5) 0%, rgba(10, 11, 16, 0.9) 100%); }
        .chat-header { padding: 16px 20px; background: rgba(18, 22, 32, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.06); display: flex; align-items: center; justify-content: space-between; }
        .chat-title-group { display: flex; align-items: center; gap: 12px; }
        .chat-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #ff2a5f, #00c6ff); display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .chat-info h2 { font-size: 17px; font-weight: 800; color: white; }
        .chat-info p { font-size: 11px; color: #00c6ff; }
        .switch-user-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: var(--text-sub); padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer; }

        .chat-messages { flex: 1; padding: 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
        .message-row { display: flex; flex-direction: column; width: 100%; }
        .message-row.me { align-items: flex-start; }
        .message-row.me .message-bubble { background: var(--sent-bubble); color: white; border-radius: 20px 20px 4px 20px; }
        .message-row.other { align-items: flex-end; }
        .message-row.other .message-bubble { background: var(--received-bubble); color: #e0e6ed; border-radius: 20px 20px 20px 4px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .message-bubble { max-width: 82%; padding: 10px 14px 8px 14px; font-size: 15px; line-height: 1.45; word-break: break-word; user-select: text; cursor: pointer; transition: 0.2s; }
        .message-bubble:active { transform: scale(0.98); }
        
        /* شكل الرسالة المُرد عليها */
        .quoted-msg { background: rgba(0, 0, 0, 0.25); border-right: 4px solid #00c6ff; padding: 6px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 6px; color: rgba(255,255,255,0.8); }
        .quoted-sender { font-weight: bold; color: #00c6ff; font-size: 11px; margin-bottom: 2px; }
        
        .sender-name { font-size: 11px; font-weight: 800; margin-bottom: 4px; color: #00c6ff; }
        .message-footer { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px; font-size: 10px; color: rgba(255, 255, 255, 0.65); }
        
        /* مؤشر الرد فوق مربع الكتابة */
        .reply-indicator { display: none; background: rgba(18, 22, 32, 0.95); padding: 10px 15px; border-top: 1px solid rgba(255,255,255,0.06); align-items: center; justify-content: space-between; font-size: 13px; border-left: 4px solid #ff2a5f; }
        .reply-indicator-content { color: white; }
        .reply-indicator-content span { font-weight: bold; color: #ff2a5f; display: block; font-size: 11px; }
        .cancel-reply { background: none; border: none; color: var(--text-sub); font-size: 18px; cursor: pointer; }

        .chat-input-area { padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); background: rgba(16, 20, 30, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.06); display: flex; gap: 10px; align-items: center; }
        .chat-input-area input { flex: 1; padding: 13px 18px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.4); color: white; font-size: 15px; outline: none; user-select: text; }
        .chat-input-area button { width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--primary-grad); color: white; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header" id="secret-trigger-header">X - O ULTRA</div>

    <!-- قسم اللعبة -->
    <div id="game-section">
        <div class="game-modes">
            <button class="mode-btn active" id="btn-mode-ai">ضد الكمبيوتر 🤖</button>
            <button class="mode-btn" id="btn-mode-online">لعب أونلاين 🌐</button>
        </div>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div><div class="cell" data-index="1"></div><div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div><div class="cell" data-index="4"></div><div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div><div class="cell" data-index="7"></div><div class="cell" data-index="8"></div>
        </div>
        
        <div class="status-bar" id="status-bar">دورك باللعب (X)</div>
        
        <div class="online-controls" id="online-controls">
            <button class="btn-join" id="btn-join-online">إنشاء / انضمام للعبة 🚀</button>
        </div>
    </div>

    <!-- النافذة السرية -->
    <div class="modal-overlay" id="secret-modal">
        <div class="modal-card">
            <h3>منطقة ندى ومحمد 🔒</h3>
            <div class="identity-selector">
                <button class="identity-btn active" id="select-nada">ندى</button>
                <button class="identity-btn" id="select-mohamed">محمد</button>
            </div>
            <input type="password" id="secret-input" placeholder="أدخل الكود السري...">
            <button id="verify-btn">دخول المحادثة</button>
            <div id="error-msg" style="color: #ff2a5f; font-size: 13px; margin-top: 12px; display: none;">الرمز غير صحيح!</div>
        </div>
    </div>

    <!-- قسم الشات -->
    <div id="chat-section">
        <div class="chat-header">
            <div class="chat-title-group">
                <div class="chat-avatar">❤️</div>
                <div class="chat-info">
                    <h2>ندى ومحمد</h2>
                    <p id="current-user-display">متصل الآن</p>
                </div>
            </div>
            <button class="switch-user-btn" id="switch-user-btn">تبديل الحساب</button>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <!-- مؤشر الرد على الرسالة -->
        <div class="reply-indicator" id="reply-indicator">
            <div class="reply-indicator-content">
                <span id="reply-to-name">الرد على: </span>
                <div id="reply-to-text">نص الرسالة...</div>
            </div>
            <button class="cancel-reply" id="cancel-reply">×</button>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="اكتب رسالة... (انقر مرتين للرد)">
            <button id="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</div>

<script type="module">
    // استيراد أدوات Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, onValue, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBEtbRajG95opDRkHbstnmt79a4v8lUX0",
      authDomain: "xojs-4e0dc.firebaseapp.com",
      projectId: "xojs-4e0dc",
      storageBucket: "xojs-4e0dc.firebasestorage.app",
      messagingSenderId: "504484947768",
      appId: "1:504484947768:web:09b3040669d558bc0ac3cd",
      measurementId: "G-2BE5RYWLYZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    const chatRef = ref(db, 'nada_mohamed_v3');
    const matchRef = ref(db, 'xo_online_match'); // مسار قاعدة البيانات للعب الأونلاين

    // الهوية والجهاز
    let deviceId = localStorage.getItem('app_device_id') || ('dev_' + Math.random().toString(36).substr(2, 9));
    localStorage.setItem('app_device_id', deviceId);
    let selectedUser = localStorage.getItem('chat_username') || 'ندى';

    // تبديل الهوية في النافذة
    const btnNada = document.getElementById('select-nada');
    const btnMohamed = document.getElementById('select-mohamed');
    const updateIdBtns = () => {
        if(selectedUser === 'ندى') { btnNada.classList.add('active'); btnMohamed.classList.remove('active'); }
        else { btnMohamed.classList.add('active'); btnNada.classList.remove('active'); }
    };
    updateIdBtns();
    btnNada.onclick = () => { selectedUser = 'ندى'; updateIdBtns(); };
    btnMohamed.onclick = () => { selectedUser = 'محمد'; updateIdBtns(); };
    document.getElementById('switch-user-btn').onclick = () => document.getElementById('secret-modal').style.display = 'flex';

    // تفعيل السر (الشات)
    let clickCount = 0; let clickTimer = null;
    const registerSecret = () => {
        clickCount++; clearTimeout(clickTimer);
        if(clickCount >= 3) { document.getElementById('secret-modal').style.display = 'flex'; clickCount = 0; }
        clickTimer = setTimeout(() => clickCount = 0, 1200);
    };
    document.getElementById('secret-trigger-header').onclick = registerSecret;
    document.getElementById('board').onclick = registerSecret;

    document.getElementById('verify-btn').onclick = () => {
        if(document.getElementById('secret-input').value === "Homos77#") {
            localStorage.setItem('chat_username', selectedUser);
            document.getElementById('current-user-display').innerText = `أنت الآن: ${selectedUser}`;
            document.getElementById('secret-modal').style.display = 'none';
            document.getElementById('game-section').style.display = 'none';
            document.getElementById('chat-section').style.display = 'flex';
        } else {
            document.getElementById('error-msg').style.display = 'block';
            setTimeout(() => document.getElementById('error-msg').style.display = 'none', 2000);
        }
    };

    // ==========================================
    // محرك لعبة X-O (أوفلاين ضد AI + أونلاين Multiplayer)
    // ==========================================
    let gameMode = 'ai'; // 'ai' or 'online'
    let localBoard = ["", "", "", "", "", "", "", "", ""];
    let aiActive = true;
    let myOnlineSymbol = null; // 'X' or 'O' in online mode

    const cells = document.querySelectorAll('.cell');
    const statusBar = document.getElementById('status-bar');
    const btnAi = document.getElementById('btn-mode-ai');
    const btnOnline = document.getElementById('btn-mode-online');
    const onlineControls = document.getElementById('online-controls');
    const btnJoinOnline = document.getElementById('btn-join-online');

    const winPatterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    // تغيير المود
    btnAi.onclick = () => { gameMode = 'ai'; btnAi.classList.add('active'); btnOnline.classList.remove('active'); onlineControls.style.display = 'none'; resetLocalGame(); };
    btnOnline.onclick = () => { gameMode = 'online'; btnOnline.classList.add('active'); btnAi.classList.remove('active'); onlineControls.style.display = 'block'; statusBar.innerText = "اضغط للاتصال بالطرف الآخر"; clearUIBoard(); };

    function checkWin(boardArr) {
        for (let p of winPatterns) if (boardArr[p[0]] && boardArr[p[0]] === boardArr[p[1]] && boardArr[p[0]] === boardArr[p[2]]) return boardArr[p[0]];
        return boardArr.includes("") ? null : "draw";
    }

    // --- مود الذكاء الاصطناعي ---
    function playLocalTurn(idx, symbol) {
        localBoard[idx] = symbol; updateUICell(idx, symbol);
        let res = checkWin(localBoard);
        if(res) {
            statusBar.innerText = res === "draw" ? "تعادل!" : "انتهت اللعبة!";
            aiActive = false; setTimeout(resetLocalGame, 2000);
        }
    }
    function botMove() {
        let empty = localBoard.map((v, i) => v === "" ? i : null).filter(v => v !== null);
        if(empty.length > 0) playLocalTurn(empty[Math.floor(Math.random() * empty.length)], "O");
    }
    function resetLocalGame() {
        localBoard = ["", "", "", "", "", "", "", "", ""]; aiActive = true; statusBar.innerText = "دورك باللعب (X)"; clearUIBoard();
    }

    // --- مود الأونلاين ---
    btnJoinOnline.onclick = () => {
        // إنشاء الجيم أو الانضمام لو في حد مستني
        update(matchRef, { requestJoin: deviceId, timestamp: serverTimestamp() });
        statusBar.innerText = "جاري الاتصال بالسيرفر...";
        
        // قراءة مبدئية لإنشاء روم لو فارغة
        onValue(matchRef, (snap) => {
            const data = snap.val();
            if(!data || !data.p1) {
                // أنا اللاعب الأول
                set(matchRef, { board: ["","","","","","","","",""], turn: "X", p1: deviceId, p2: null, status: "waiting" });
                myOnlineSymbol = "X";
            } else if (data.p1 !== deviceId && !data.p2) {
                // أنا اللاعب الثاني
                update(matchRef, { p2: deviceId, status: "playing" });
                myOnlineSymbol = "O";
            } else if (data.p1 === deviceId) { myOnlineSymbol = "X"; }
            else if (data.p2 === deviceId) { myOnlineSymbol = "O"; }
        }, { onlyOnce: true });
    };

    // الاستماع الحي للعبة الأونلاين
    onValue(matchRef, (snap) => {
        if(gameMode !== 'online') return;
        const data = snap.val();
        if(!data) return;

        // تحديث اللوحة المرئية
        data.board.forEach((val, i) => updateUICell(i, val));

        if(data.status === "waiting") {
            statusBar.innerText = "في انتظار دخول الطرف الآخر... ⏳";
        } else if (data.status === "playing") {
            if(data.turn === myOnlineSymbol) statusBar.innerText = "إلعب، هذا دورك! (" + myOnlineSymbol + ")";
            else statusBar.innerText = "انتظر دور الطرف الآخر... (" + (myOnlineSymbol==="X"?"O":"X") + ")";
        }

        // فحص الفوز الأونلاين
        let res = checkWin(data.board);
        if(res && data.status === "playing") {
            statusBar.innerText = res === "draw" ? "انتهت بالتعادل! 🤝" : `اللاعب (${res}) فاز! 🎉`;
            update(matchRef, { status: "finished" });
            if(myOnlineSymbol === "X") setTimeout(() => set(matchRef, { board: ["","","","","","","","",""], turn: "X", p1: deviceId, p2: data.p2, status: "playing" }), 3000);
        }
    });

    // تفاعل الضغط على المربعات
    cells.forEach(cell => {
        cell.onclick = () => {
            const idx = cell.getAttribute('data-index');
            
            if(gameMode === 'ai') {
                if(localBoard[idx] === "" && aiActive) {
                    playLocalTurn(idx, "X");
                    if(aiActive) setTimeout(botMove, 400);
                }
            } else if (gameMode === 'online') {
                // التأكد من أن دوري واللعبة شغالة
                onValue(matchRef, (snap) => {
                    const data = snap.val();
                    if(data && data.status === "playing" && data.turn === myOnlineSymbol && data.board[idx] === "") {
                        let newBoard = [...data.board];
                        newBoard[idx] = myOnlineSymbol;
                        let nextTurn = myOnlineSymbol === "X" ? "O" : "X";
                        update(matchRef, { board: newBoard, turn: nextTurn });
                    }
                }, { onlyOnce: true });
            }
        };
    });

    function updateUICell(idx, symbol) {
        cells[idx].innerText = symbol;
        cells[idx].className = 'cell';
        if(symbol) cells[idx].classList.add(symbol.toLowerCase());
    }
    function clearUIBoard() { cells.forEach(c => { c.innerText = ""; c.className = 'cell'; }); }


    // ==========================================
    // محرك الشات المزدوج مع نظام الرد (Reply System)
    // ==========================================
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-messages');
    
    // متغيرات الرد
    let replyToData = null; 
    const replyIndicator = document.getElementById('reply-indicator');
    const replyToName = document.getElementById('reply-to-name');
    const replyToText = document.getElementById('reply-to-text');
    const cancelReplyBtn = document.getElementById('cancel-reply');

    cancelReplyBtn.onclick = () => {
        replyToData = null;
        replyIndicator.style.display = 'none';
    };

    sendBtn.onclick = sendMsg;
    chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendMsg(); };

    function sendMsg() {
        const text = chatInput.value.trim();
        if (text) {
            const timeFormatted = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            
            let msgPayload = {
                senderId: deviceId, senderName: selectedUser, msg: text, time: timeFormatted, timestamp: serverTimestamp()
            };

            // لو في رد نرفقه
            if (replyToData) {
                msgPayload.replyTo = replyToData;
            }

            push(chatRef, msgPayload);
            chatInput.value = '';
            cancelReplyBtn.click(); // مسح مؤشر الرد بعد الإرسال
        }
    }

    onChildAdded(chatRef, (snapshot) => {
        const data = snapshot.val();
        const isMe = (data.senderId === deviceId) || (data.senderName === selectedUser);
        const row = document.createElement('div'); row.className = `message-row ${isMe ? 'me' : 'other'}`;
        
        const bubble = document.createElement('div'); bubble.className = 'message-bubble';
        
        // لو الرسالة دي عبارة عن رد
        let replyHtml = '';
        if (data.replyTo) {
            replyHtml = `
                <div class="quoted-msg">
                    <div class="quoted-sender">${data.replyTo.sender}</div>
                    <div class="quoted-text">${data.replyTo.text}</div>
                </div>
            `;
        }

        let nameHtml = !isMe ? `<div class="sender-name">${data.senderName || 'الطرف الآخر'}</div>` : '';
        let ticksHtml = isMe ? `<span class="ticks" style="color:#00f2fe;font-size:12px;">✓✓</span>` : '';

        bubble.innerHTML = `
            ${nameHtml}
            ${replyHtml}
            <div>${data.msg}</div>
            <div class="message-footer">
                <span>${data.time || ''}</span>
                ${ticksHtml}
            </div>
        `;

        // تفعيل النقر المزدوج على الكبسولة لعمل رد
        let tapTimeout;
        let lastTap = 0;
        bubble.addEventListener('touchend', function(e) {
            let currentTime = new Date().getTime();
            let tapLength = currentTime - lastTap;
            clearTimeout(tapTimeout);
            if (tapLength < 500 && tapLength > 0) {
                // Double tap detected -> Trigger Reply
                initiateReply(data.senderName, data.msg);
                e.preventDefault();
            } else {
                tapTimeout = setTimeout(function() { clearTimeout(tapTimeout); }, 500);
            }
            lastTap = currentTime;
        });
        
        // للكمبيوتر (دبل كليك)
        bubble.addEventListener('dblclick', () => initiateReply(data.senderName, data.msg));

        row.appendChild(bubble); chatContainer.appendChild(row);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    });

    function initiateReply(senderName, text) {
        replyToData = { sender: senderName, text: text.length > 40 ? text.substring(0, 40) + '...' : text };
        replyToName.innerText = `الرد على: ${senderName}`;
        replyToText.innerText = replyToData.text;
        replyIndicator.style.display = 'flex';
        chatInput.focus();
    }

</script>
</body>
</html>
